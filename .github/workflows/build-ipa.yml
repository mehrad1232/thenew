name: Build NOVA iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Find and extract project ZIP (normalize Windows paths)
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root. Upload NOVA_iOS12_Swift_Project_fixed.zip." >&2
            exit 1
          fi
          export ZIP_FILE
          DEST="$RUNNER_TEMP/nova-source"
          mkdir -p "$DEST"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path, PurePosixPath
          archive = os.environ["ZIP_FILE"]
          dest = Path(os.environ["RUNNER_TEMP"]) / "nova-source"
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  # Some Windows-created ZIPs store backslashes as literal path characters.
                  name = info.filename.replace("\\", "/")
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  target = dest.joinpath(*p.parts)
                  if info.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open("wb") as out:
                          out.write(src.read())
          PY
          PROJECT_FILE="$(find "$DEST" -type d -name 'NOVACalculator.xcodeproj' -print -quit)/project.pbxproj"
          if [ ! -f "$PROJECT_FILE" ]; then
            echo "Could not find NOVACalculator.xcodeproj/project.pbxproj after extraction." >&2
            find "$DEST" -maxdepth 5 -print
            exit 1
          fi
          echo "project_dir=$(dirname "$(dirname "$PROJECT_FILE")")" >> "$GITHUB_OUTPUT"
          echo "project_file=$(dirname "$PROJECT_FILE")" >> "$GITHUB_OUTPUT"
          echo "Found project file: $PROJECT_FILE"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "${{ steps.source.outputs.project_file }}"

      - name: Build iPhone app (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.source.outputs.project_dir }}"
          xcodebuild \
            -project NOVACalculator.xcodeproj \
            -scheme NOVACalculator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NOVA-DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/NOVA-DerivedData/Build/Products/Release-iphoneos/NOVACalculator.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/NOVACalculator.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/NOVA-unsigned.ipa" Payload

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-unsigned-IPA
          path: NOVA-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
